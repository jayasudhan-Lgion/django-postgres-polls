<!DOCTYPE html>
<html>
<head>
    <title>Polls</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 60px;
            background-color: #f4f4f4;
        }
        .container {
           background: white;
           padding: 30px 40px;
           border-radius: 8px;
           box-shadow: 0 2px 8px rgba(0,0,0,0.1);
           max-width: 600px;
           width: 90%;
}
        h1 { font-size: 22px; }
        ul { list-style: none;}
        li {margin: 8px 0; }
        a { text-decoration: none; color: #2563eb; }
        button {
            margin-top: 15px;
            padding: 8px 16px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="text"],
        input[type="password"] { 
    padding: 8px 10px;
    margin: 4px 0 12px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
    width: 100%;
    box-sizing: border-box;
}
p {
    margin: 10px 0;
}
label {
    font-weight: bold;
}
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; padding-bottom:10px; border-bottom:1px solid #eee;">
    {% if request.resolver_match.url_name != 'index' %}
<a href="/polls/" style="font-size: 14px; color: #666; text-decoration:none;">← All Polls</a>
{% endif %}
    <div style="font-size:14px; margin-left:auto;">
        {% if user.is_authenticated %}
            <span style="color:#333;">Hello, {{ user.username }}</span>
            <form action="{% url 'logout' %}" method="post" style="display:inline; margin-left:10px;">
                {% csrf_token %}
                <button type="submit" style="background:none; border:none; color:#2563eb; cursor:pointer; font-size:14px; padding:0;">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" style="color:#2563eb; text-decoration:none;">Login</a>
            <span style="color:#ccc;"> | </span>
            <a href="{% url 'signup' %}" style="color:#2563eb; text-decoration:none;">Sign Up</a>
        {% endif %}
    </div>
</div>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
