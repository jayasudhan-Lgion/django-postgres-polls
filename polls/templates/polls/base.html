<!DOCTYPE html>
<html>
<head>
    <title>Polls</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 60px;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 400px;
        }
        h1 { font-size: 22px; }
        li { list-style: none; margin: 8px 0; }
        a { text-decoration: none; color: #2563eb; }
        button {
            margin-top: 15px;
            padding: 8px 16px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
